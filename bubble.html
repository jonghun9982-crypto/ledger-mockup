<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>통장 번역기 · 생각 말풍선</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --paper:#f4efe3; --ink:#1b1b1f; --grey:#6b6a66; --card:#fffdf7; --soft:#ebe5d6;
  --yellow:#ffd23f; --mint:#7fd8ad; --sky:#8cc4ff; --pink:#ffaed0; --lilac:#c3b2ff; --peach:#ffbd7a; --cloud:#ffffff; 
  --green:#1f8a5b; --amber:#c98a12; --blue:#2f55c9;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#d9d3c4}
body{font-family:"Pretendard","Pretendard Variable","Noto Sans CJK KR","Noto Sans KR",system-ui,sans-serif;color:var(--ink);
  -webkit-font-smoothing:antialiased;word-break:keep-all}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.phone{width:390px;height:844px;margin:0 auto;background:var(--paper);position:relative;overflow:hidden;padding:54px 20px 20px;display:flex;flex-direction:column}

header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;font-weight:900;letter-spacing:-.4px}
.today{font-size:14px;font-weight:700;color:var(--grey)}
.txtbtn{font:inherit;background:none;border:0;font-size:15px;font-weight:800;color:var(--ink);text-decoration:underline;
  text-underline-offset:4px;text-decoration-thickness:2px;min-height:44px;padding:0 2px;cursor:pointer;text-align:left}
.txtbtn.sub{font-size:13.5px;font-weight:700;color:var(--grey);text-decoration-thickness:1px}
.paste{margin-top:6px}
.sms{font-size:12.5px;color:#8d8a82;font-weight:600;margin-top:-4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* timeline (app underneath) */
.tl-title{margin-top:auto;font-size:14px;font-weight:800;color:var(--grey);display:flex;justify-content:space-between;align-items:baseline}
.timeline{list-style:none;margin-top:8px;position:relative;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.timeline::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;border-left:2.5px dotted #b9b3a5}
.entry{position:relative;background:var(--card);border:2px solid #cfc8b8;border-radius:16px;padding:0 14px;min-height:48px;
  display:flex;flex-direction:column;justify-content:center;cursor:pointer;transition:border-color .2s}
.entry::before{content:"";position:absolute;left:-21px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--dot,#cfc8b8);border:2px solid var(--ink)}
.entry .line{font-size:15.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
.entry .line small{font-size:12px;color:var(--grey);font-weight:700}
.entry .exact{display:none;border-top:2px dashed #d6d0c2;padding:8px 0 10px;font-size:14px;color:#3d3c38;font-weight:600;gap:4px 14px;flex-wrap:wrap}
.entry .exact b{font-weight:800}
.entry.open{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.entry.open .exact{display:flex}
.entry.new{animation:drop .6s var(--spring) both;border-color:var(--ink)}
@keyframes drop{from{transform:translateY(-70px);opacity:0}to{transform:none;opacity:1}}

/* clouds */
.sky{position:absolute;left:0;right:0;top:172px;z-index:10;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.sky > *{pointer-events:auto}
.cloud{position:relative;background:var(--cloud);border:3px solid var(--ink);box-shadow:4px 5px 0 var(--ink);
  border-radius:46px 58px 50px 62px / 54px 46px 60px 50px;padding:22px 26px;max-width:320px;text-align:center;
  font-size:19px;font-weight:800;line-height:1.45;animation:rise .6s var(--spring) both, bob 4s ease-in-out .6s infinite}
.cloud.reply{background:var(--mint)}
.cloud .hint{display:block;font-size:12.5px;color:var(--grey);font-weight:700;margin-bottom:4px}
.puffs{position:relative;height:34px;width:100%;}
.puffs i{position:absolute;border:3px solid var(--ink);background:var(--cloud);border-radius:50%;box-shadow:2px 3px 0 var(--ink)}
.puffs i:nth-child(1){width:18px;height:18px;left:226px;top:4px}
.puffs i:nth-child(2){width:11px;height:11px;left:250px;top:22px}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.92)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-5px)}}
.replies{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 10px;margin-top:18px;max-width:350px}
.cbtn{font:inherit;min-height:48px;min-width:64px;padding:0 18px;border:3px solid var(--ink);background:var(--card);
  border-radius:26px 30px 24px 32px / 28px 24px 30px 26px;font-size:17px;font-weight:900;color:var(--ink);box-shadow:3px 4px 0 var(--ink);
  transform:rotate(var(--r,0deg));cursor:pointer;transition:transform .15s,box-shadow .15s;animation:rise .5s var(--spring) both}
.cbtn:active{transform:rotate(var(--r,0deg)) translate(3px,4px);box-shadow:0 0 0 var(--ink)}
.cbtn:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.cbtn.soft{background:var(--soft);font-size:15px;font-weight:800}
.cbtn.write{border-style:dashed;font-size:15px}
.cbtn.yes{background:var(--mint);min-width:110px}
.cbtn.no{background:var(--card);min-width:110px}

.dict-hint{margin-top:2px;font-size:13px;min-height:36px;color:var(--grey);text-decoration-thickness:1px;font-weight:700;animation:rise .5s var(--spring) both}
.dict-hint b{color:var(--ink);font-weight:800}
.dict-hint + .replies{margin-top:8px}

/* 내 사전 */
.view{display:flex;flex-direction:column;flex:1;min-height:0}
.view[hidden]{display:none}
.dict-fact{font-size:13.5px;font-weight:700;color:var(--grey);margin-top:6px}
.dict-fact b{color:var(--ink);font-weight:800}
.dict-scroll{flex:1;min-height:0;overflow:auto;margin:2px -20px 0;padding:0 20px 4px}
.sec{font-size:14px;font-weight:800;color:var(--grey);margin:10px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font-size:12px;font-weight:700}
.words{list-style:none;display:flex;flex-direction:column;gap:5px}
.w{background:var(--card);border:2px solid #cfc8b8;border-radius:14px;padding:6px 14px;cursor:pointer}
.w .row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;min-height:32px}
.w .raw{font-size:13px;font-weight:600;color:#8d8a82;line-height:1.35}
.w .raw .arr{color:#b9b3a5;margin-left:4px}
.chip{display:inline-block;margin-top:2px;font-size:11.5px;font-weight:700;color:var(--grey);background:var(--soft);border-radius:999px;padding:2px 8px}
.stk{display:inline-block;border:2.5px solid var(--ink);border-radius:999px;padding:3px 13px;font-size:15px;font-weight:900;
  box-shadow:2px 3px 0 var(--ink);transform:rotate(var(--r,0deg));white-space:nowrap}
.cnt{font-size:12px;font-weight:700;color:var(--grey);min-width:56px;text-align:right}
.w.fixed{border-color:var(--amber)}
.badge{display:inline-block;font-size:11.5px;font-weight:800;color:var(--amber);border:1.5px solid var(--amber);border-radius:999px;padding:1px 8px;margin-top:2px}
.w .more{display:none;border-top:2px dashed #d6d0c2;margin-top:6px;align-items:center;gap:0 16px;flex-wrap:wrap}
.w .more p{font-size:13px;color:#3d3c38;font-weight:600;flex-basis:100%;padding-top:6px}
.w .more .txtbtn{min-height:38px}
.w.open{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.w.open.fixed{border-color:var(--amber);box-shadow:3px 3px 0 var(--amber)}
.w.open .more{display:flex}
.w .more .txtbtn{font-size:14px}

.demo{display:flex;gap:6px;justify-content:center;margin-top:8px;border-top:2px dashed #cfc8b8;padding-top:4px}
.demo .txtbtn{font-size:12.5px;color:var(--grey);font-weight:700;text-decoration-thickness:1px}
.demo .txtbtn[aria-pressed="true"]{color:var(--ink);font-weight:900}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="phone">
  <header><h1 id="title">통장 번역기</h1><span class="today num">10월 28일 (수)</span></header>

  <section class="view" id="v-main">
  <button class="txtbtn paste" id="paste">결제 문자 붙여넣기</button>
  <p class="sms num" id="sms">[Web발신] 우리 10/28 21:14 출금 4,500원 CU강남점</p>

  <div class="sky" id="sky" aria-live="polite"></div>

  <div class="tl-title"><span>오늘 적어 둔 것</span><span class="num" id="total" style="font-size:12.5px;font-weight:700">3건 · 1만 원대</span></div>
  <ul class="timeline" id="tl"></ul>
  </section>

  <!-- 내 사전: 아래 숫자(단어 24개, 87%, n번 맞힘)는 전부 목업용 예시 숫자이며 실제 데이터 아님 -->
  <section class="view" id="v-dict" hidden>
    <p class="dict-fact num">단어 <b>24개</b> · 이번 달 자동으로 맞힌 비율 <b>87%</b></p>
    <div class="dict-scroll">
      <div class="sec"><span>가게</span><small class="num">3개</small></div>
      <ul class="words" id="d-shop"></ul>
      <div class="sec"><span>은행 말</span><small class="num">6개</small></div>
      <ul class="words" id="d-bank"></ul>
      <button class="txtbtn sub num" style="margin-top:2px;min-height:34px">단어 15개 더 보기</button>
    </div>
  </section>

  <nav class="demo" aria-label="목업 예시 바꾸기">
    <button class="txtbtn" data-m="ask">처음 보는 가게</button>
    <button class="txtbtn" data-m="guess">아는 가게</button>
    <button class="txtbtn" data-m="group">여러 번 결제</button>
    <button class="txtbtn" data-m="dict">내 사전</button>
  </nav>
</div>

<script>
// 예시 데이터 (실제 거래 아님). 화면엔 대략적인 말, 아래엔 정확한 값.
const approx=n=>n>=10000?`${Math.floor(n/10000)}만 원대`:`${Math.floor(n/1000)}천 원대`;
const BASE=[
 {when:"아침",place:"지쿠",cat:"",time:"08:12",amt:2040,raw:"주식회사 지바이",dot:"var(--yellow)"},
 {when:"점심쯤",place:"식당",cat:"",time:"12:38",amt:11000,raw:"한솥도시락 역삼점",dot:"var(--peach)"},
 {when:"오후",place:"자판기",cat:"간식",time:"15:02",amt:1500,raw:"이스턴웰스자판기",dot:"var(--mint)"},
];
const NOW={when:"오늘 저녁",place:"편의점",time:"21:14",amt:4500,raw:"CU강남점",dot:"var(--pink)"};
const GROUP={when:"밤",place:"피시방",count:3,time:"19:40 · 20:52 · 22:05",amt:9000,raw:"토스페이먼츠 3건 (3,000원씩)",dot:"var(--sky)"};
let entries=[], mode="ask";
const $=id=>document.getElementById(id);

function entryHTML(e,k){
  const parts=[e.when,e.place,e.cat,e.count?`${e.count}번`:"",e.count?`${approx(e.amt).replace("원대","원")}어치`:approx(e.amt)].filter(Boolean);
  return `<li class="entry ${e.isNew?'new':''} ${e.open?'open':''}" style="--dot:${e.dot}" data-k="${k}" role="button" aria-expanded="${!!e.open}">
    <div class="line num"><span>${parts.join(" · ")}</span><small>${e.open?'접기':'자세히'}</small></div>
    <div class="exact num"><span><b>${e.time}</b></span><span><b>${e.amt.toLocaleString("ko-KR")}원</b></span><span>${e.raw}</span></div></li>`;
}
function renderTL(){
  $("tl").innerHTML=entries.map(entryHTML).join("");
  const sum=entries.reduce((s,e)=>s+e.amt,0);
  $("total").textContent=`${entries.reduce((s,e)=>s+(e.count||1),0)}건 · ${approx(sum)}`;
}
$("tl").addEventListener("click",ev=>{const li=ev.target.closest(".entry");if(!li)return;const e=entries[+li.dataset.k];e.open=!e.open;entries.forEach(x=>x.isNew=false);renderTL();});

function sky(html){ $("sky").innerHTML=html; } // 구름 뒤 위쪽 혹(bump)은 제거함
const puffs=`<div class="puffs" aria-hidden="true"><i></i><i></i></div>`;
function ask(){
  sky(`<div class="cloud"><span class="hint">방금 결제 문자를 읽었어요</span>저녁쯤 편의점에서 4천 원대 썼죠?<br>뭐였어요?</div>${puffs}
   <div class="replies">
    <button class="cbtn" style="--r:-4deg;background:var(--peach)" data-a="담배">담배</button>
    <button class="cbtn" style="--r:3deg;background:var(--yellow)" data-a="간식">간식</button>
    <button class="cbtn" style="--r:-2deg;background:var(--sky)" data-a="음료">음료</button>
    <button class="cbtn soft" style="--r:2deg" data-a="?">기억 안 나요</button>
    <button class="cbtn write" style="--r:-3deg" data-a="write">직접 쓰기</button>
   </div>`);
}
function guess(){
  sky(`<div class="cloud"><span class="hint">자주 가는 CU강남점이에요</span>담배 같아요, 맞죠?</div>${puffs}
   <button class="txtbtn dict-hint" data-go="dict">내 사전에서 찾았어요 · <b>CU강남점 = 담배</b></button>
   <div class="replies"><button class="cbtn yes" style="--r:-3deg" data-a="담배">맞아요</button>
   <button class="cbtn no" style="--r:3deg" data-a="ask">아니에요</button></div>`);
}
function group(){
  sky(`<div class="cloud"><span class="hint">같은 곳에서 결제가 3번 있었어요</span>오늘 피시방 3번, 합쳐서<br><span class="num">9천 원어치</span>예요. 전부 피시방 맞죠?</div>${puffs}
   <div class="replies"><button class="cbtn yes" style="--r:-3deg" data-a="group-yes">맞아요</button>
   <button class="cbtn no" style="--r:2deg" data-a="ask">따로 볼게요</button></div>`);
}
function answer(a){
  if(a==="ask") return ask();
  if(a==="write") a="직접 쓴 이름"; // 목업: 입력창 생략
  entries.forEach(e=>{e.isNew=false;e.open=false});
  if(a==="group-yes"){
    entries.push({...GROUP,isNew:true});
    sky(`<div class="cloud reply">좋아요! 피시방 3번,<br>한 줄로 묶어 둘게요</div>${puffs}`);
  }else{
    const known=a!=="?";
    entries.push({...NOW,cat:known?a:"기억 안 남",isNew:true});
    sky(`<div class="cloud reply">${known?`역시! ${a}로 적어 둘게요`:"괜찮아요, 일단 편의점으로<br>적어 둘게요"}</div>${puffs}`);
  }
  renderTL();
  setTimeout(()=>{ const c=document.querySelector(".cloud.reply"); if(c){c.style.transition="opacity .4s";c.style.opacity="0";} },2600);
}
$("sky").addEventListener("click",ev=>{const g=ev.target.closest("[data-go]");if(g)return setMode(g.dataset.go);const b=ev.target.closest(".cbtn");if(b)answer(b.dataset.a)});

// 내 사전 (예시 단어, 숫자는 목업용)
const DICT={
 shop:[
  {raw:"CU강남점",word:"담배",n:12,bg:"var(--peach)",r:-3},
  {raw:"이스턴웰스자판기",word:"간식",n:5,bg:"var(--yellow)",r:2,fixed:"처음엔 음료였는데 아니에요로 고쳐서 간식이 됐어요."},
  {raw:"토스페이먼츠",word:"피시방",n:9,bg:"var(--sky)",r:-2},
 ],
 bank:[
  {raw:"지바이",word:"지쿠",n:18,bg:"var(--yellow)",r:3},
  {raw:"타행대량",word:"월급",n:3,bg:"var(--mint)",r:-2},
  {raw:"예금결산",word:"통장 이자",n:2,bg:"var(--mint)",r:2},
  {raw:"오픈뱅킹 내통장결제",word:"버카충",n:4,bg:"var(--lilac)",r:-3,chip:"다른 앱이 끌어간 돈"},
  {raw:"CMS 공동",word:"대출이자",n:3,bg:"var(--soft)",r:2,chip:"자동출금"},
  {raw:"국고이체",word:"정부 지원금",n:1,bg:"var(--pink)",r:-2},
 ]};
function wordHTML(w,i,k){
  return `<li class="w ${w.fixed?'fixed':''} ${w.open?'open':''}" data-k="${k}:${i}" role="button" aria-expanded="${!!w.open}">
   <div class="row"><div class="raw">${w.raw}<span class="arr" aria-hidden="true">→</span>${w.chip?`<br><span class="chip">${w.chip}</span>`:''}${w.fixed?`<br><span class="badge">아니에요로 고친 단어</span>`:''}</div>
   <span class="stk" style="--r:${w.r}deg;background:${w.bg}">${w.word}</span><span class="cnt num">${w.n}번 맞힘</span></div>
   <div class="more">${w.fixed?`<p>${w.fixed}</p>`:''}<button class="txtbtn">단어 고치기</button><button class="txtbtn sub">지우기</button></div></li>`;
}
function renderDict(){
  $("d-shop").innerHTML=DICT.shop.map((w,i)=>wordHTML(w,i,"shop")).join("");
  $("d-bank").innerHTML=DICT.bank.map((w,i)=>wordHTML(w,i,"bank")).join("");
}
$("v-dict").addEventListener("click",ev=>{if(ev.target.closest(".txtbtn"))return;const li=ev.target.closest(".w");if(!li)return;const [k,i]=li.dataset.k.split(":");DICT[k][+i].open=!DICT[k][+i].open;renderDict();});
DICT.shop[1].open=true;
function setMode(m){
  mode=m;
  document.querySelectorAll(".demo .txtbtn").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===m));
  const isDict=m==="dict";
  $("v-main").hidden=isDict; $("v-dict").hidden=!isDict; $("title").textContent=isDict?"내 사전":"통장 번역기";
  if(isDict){ $("sky").innerHTML=""; renderDict(); return; }
  entries=BASE.map(e=>({...e})); renderTL();
  $("sms").textContent = m==="group" ? "[Web발신] 우리 10/28 22:05 출금 3,000원 토스페이먼츠 외 2건" : "[Web발신] 우리 10/28 21:14 출금 4,500원 CU강남점";
  ({ask,guess,group})[m]();
}
document.querySelector(".demo").addEventListener("click",ev=>{const b=ev.target.closest("[data-m]");if(b)setMode(b.dataset.m)});
$("paste").onclick=()=>setMode(mode);
setMode("ask");
// 스크린샷용 훅: 답한 뒤 상태 + 새 항목 펼침 (말풍선은 그대로 둠)
window.__demo=s=>{
  if(s==="answered"){setMode("ask");answer("담배");entries[entries.length-1].open=true;entries[entries.length-1].isNew=false;renderTL();}
  if(s==="group") setMode("group");
  if(s==="guess") setMode("guess");
  if(s==="dict") setMode("dict");
};
</script>
<a href="./" style="position:fixed;top:10px;right:10px;z-index:9999;font:600 12px/1 Pretendard,system-ui,sans-serif;padding:7px 11px;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;text-decoration:none">← 카드 게임 시안</a>
</body>
</html>
